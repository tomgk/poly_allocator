name: Generate Doxygen Documentation

on:
  push:
    branches:
      - main
    paths:
      - '**.hpp'
      - '**.h'
      - 'Doxyfile'
      - '.github/workflows/doxygen.yml'

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz

      - name: Generate Documentation
        run: doxygen Doxyfile

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Check if docs branch exists
        id: check-branch
        run: |
          if git rev-parse --verify origin/docs >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create or update docs branch
        run: |
          # Create orphan branch if it doesn't exist
          if [ "${{ steps.check-branch.outputs.exists }}" = "false" ]; then
            git checkout --orphan docs
            git rm -rf .
          else
            git checkout docs --
          fi

      - name: Copy generated documentation
        run: |
          mkdir -p docs
          cp -r docs/html/* docs/
          rm -rf docs/html

      - name: Commit and push documentation
        run: |
          git add -A
          git commit -m "docs: Update documentation from main branch" || echo "No changes to commit"
          git push -u origin docs --force

      - name: Create summary
        run: |
          echo "## Documentation Generated ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Doxygen documentation has been generated and pushed to the [docs branch](https://github.com/${{ github.repository }}/tree/docs)" >> $GITHUB_STEP_SUMMARY
